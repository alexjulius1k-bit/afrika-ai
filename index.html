<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFRIKA AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>🌍 AFRIKA AI</h1>
    <p>Your African AI assistant</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to AFRIKA AI</h2>
      <p>Ask questions, learn, create and discover new possibilities with AI.</p>
    </section>

    <div class="features">
      <button>📚 Learn</button>
      <button>💼 Business</button>
      <button>✍️ Writing</button>
      <button>🤖 AI</button>
      <button>🏠 Home</button>
      <button>🔎 Explore</button>
      <button>👤 Profile</button>
    </div>

    <section class="chat">
      <p><strong>AFRIKA AI:</strong> Hello! 👋 I'm AFRIKA AI. How can I help you today?</p>
      <input type="text" placeholder="Ask AFRIKA AI anything...">
      <button>Send</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
